<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nieta Digital</title>
    <link rel="icon" type="image/png" href="/favicon1.png?v=1" />
    <link rel="apple-touch-icon" href="/favicon1.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Formulaire statique caché : permet à Netlify de détecter le formulaire au build,
         même si le vrai formulaire est rendu dynamiquement par React. Ne pas supprimer. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
